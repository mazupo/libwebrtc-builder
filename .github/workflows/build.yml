name: Build libwebrtc

on:
  push:
    tags:
      - "*"
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: "WebRTC branch to build (e.g. 8010). Leave empty to auto-detect."
        required: false
        type: string
      force:
        description: "Build even if a release for that branch already exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      should_build: ${{ steps.pick.outputs.should_build }}

    steps:
      - name: Resolve WebRTC branch
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.webrtc_branch }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: build exactly what was tagged.
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${INPUT_BRANCH:-}"
          if [ -z "$VERSION" ]; then
            # Take the second newest branched milestone: the newest one is still
            # being stabilized. Old milestones name their branch "m79" instead of a
            # number, so keep only the numeric ones before sorting.
            VERSION=$(curl -sSf "https://chromiumdash.appspot.com/fetch_milestones?only_branched=true" \
              | jq -r '[.[] | select((.webrtc_branch // "") | test("^[0-9]+$"))]
                       | sort_by(.milestone) | reverse | .[1].webrtc_branch')
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not determine a WebRTC branch from Chromium Dash"
            exit 1
          fi
          echo "Selected WebRTC branch: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${INPUT_FORCE:-false}" != "true" ] && gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      WEBRTC_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Free up disk space on runner
        run: |
          echo "Before cleanup:"
          df -h

          echo "🧹 Removing unused preinstalled tools..."
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          echo "🧹 Cleaning up cache and logs..."
          sudo rm -rf /home/runner/.cache
          sudo rm -rf /home/runner/.rustup /home/runner/.cargo
          sudo rm -rf /home/runner/.npm /home/runner/.yarn

          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3

      - name: Test Remote Connection
        run: |
          git ls-remote --exit-code https://webrtc.googlesource.com/src refs/branch-heads/$WEBRTC_VERSION

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          ./depot_tools/ensure_bootstrap
          echo "PATH=$PATH:$(pwd)/depot_tools" >> $GITHUB_ENV

      - name: Check PATH
        run: echo $PATH

      - name: Clone WebRTC source
        run: |
          mkdir webrtc
          cd webrtc
          fetch --nohooks webrtc
          cd src
          build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          git fetch origin refs/branch-heads/$WEBRTC_VERSION:refs/heads/branch-heads/$WEBRTC_VERSION
          git checkout branch-heads/$WEBRTC_VERSION
          git clean -df
          gclient sync -D --force --reset --with_branch_heads --no-history

      - name: Build WebRTC
        env:
          PATH: ${{ env.PATH }}
        run: |
          cd webrtc/src
          mkdir -p out/Release
          gn gen out/Release --args="
              target_os=\"linux\" 
              target_cpu=\"arm64\" 
              is_debug=false 
              rtc_include_tests=false 
              rtc_use_x11=false 
              rtc_use_h264=true 
              rtc_use_pipewire=false 
              use_rtti=true 
              use_glib=false 
              use_custom_libcxx=false 
              rtc_build_tools=false 
              rtc_build_examples=false 
              is_component_build=false 
              is_component_ffmpeg=true 
              ffmpeg_branding=\"Chrome\" 
              proprietary_codecs=true 
              clang_use_chrome_plugins=false"
          ninja -C out/Release

      - name: Organize Output
        run: |
          mkdir -p include
          rsync -amv --include='*/' \
            --include='*.h' \
            --include='*.hpp' \
            --include='*.inc' \
            --include='*.def' \
            --exclude='*' webrtc/src/ include/

          if [ -d "src/out/Release/gen" ]; then
            echo "Extracting generated headers..."
            rsync -amv --include='*/' \
              --include='*.h' \
              --include='*.inc' \
              --exclude='*' webrtc/src/out/Release/gen/ include/
          fi

          echo "🧹 Cleaning up test files and examples..."
          find include -type f \( \
            -name "*unittest*" \
            -o -name "*_test.h" \
            -o -name "*_test.inc" \
            -o -path "*/test/*" \
            -o -path "*/examples/*" \
            -o -path "*/testing/*" \
          \) -delete
          find include -type d -empty -delete

          mkdir -p lib
          cp webrtc/src/out/Release/obj/libwebrtc.a lib/

      - name: Create release
        run: |
          tar -czvf libwebrtc-arm64.tar.gz include lib

      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WEBRTC_VERSION }}
          name: ${{ env.WEBRTC_VERSION }}
          files: libwebrtc-arm64.tar.gz
