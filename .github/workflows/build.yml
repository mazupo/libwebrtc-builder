name: Build libwebrtc

on:
  push:
    tags:
      - "*"
  schedule:
    # Every Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: "WebRTC branch to build (e.g. 8010). Leave empty to auto-detect."
        required: false
        type: string
      force:
        description: "Build even if a release for that branch already exists."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Build without publishing a release. Runs outside main never publish."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      should_build: ${{ steps.pick.outputs.should_build }}
      publish: ${{ steps.pick.outputs.publish }}

    steps:
      - name: Resolve WebRTC branch
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.webrtc_branch }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: build exactly what was tagged.
            {
              echo "version=${{ github.ref_name }}"
              echo "should_build=true"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only main publishes; a dry run or a run from another branch just builds.
          if [ "${INPUT_DRY_RUN:-false}" != "true" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          VERSION="${INPUT_BRANCH:-}"
          if [ -z "$VERSION" ]; then
            # Take the second newest branched milestone: the newest one is still
            # being stabilized. Old milestones name their branch "m79" instead of a
            # number, so keep only the numeric ones before sorting.
            VERSION=$(curl -sSf "https://chromiumdash.appspot.com/fetch_milestones?only_branched=true" \
              | jq -r '[.[] | select((.webrtc_branch // "") | test("^[0-9]+$"))]
                       | sort_by(.milestone) | reverse | .[1].webrtc_branch')
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not determine a WebRTC branch from Chromium Dash"
            exit 1
          fi
          echo "Selected WebRTC branch: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISH" != "true" ]; then
            echo "::notice::Building $VERSION without publishing a release."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${INPUT_FORCE:-false}" != "true" ] && gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      WEBRTC_VERSION: ${{ needs.resolve-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space on runner
        run: |
          echo "Before cleanup:"
          df -h

          echo "🧹 Removing unused preinstalled tools..."
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          echo "🧹 Cleaning up cache and logs..."
          sudo rm -rf /home/runner/.cache
          sudo rm -rf /home/runner/.rustup /home/runner/.cargo
          sudo rm -rf /home/runner/.npm /home/runner/.yarn

          echo "After cleanup:"
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential python3

      - name: Build arm64 sysroot
        run: |
          # jammy = the oldest deployment target (Jetson L4T 36 / Ubuntu 22.04).
          # It sets the minimum glibc and libstdc++ the release supports, so bump
          # the suite and libstdc++-N-dev together once that target moves.
          SYSROOT="$GITHUB_WORKSPACE/sysroot"
          APT="$GITHUB_WORKSPACE/.apt"
          mkdir -p "$APT/lists/partial" "$APT/archives/partial"
          : > "$APT/status"
          echo "deb [arch=arm64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://ports.ubuntu.com/ubuntu-ports jammy main" > "$APT/sources.list"
          APT_OPTS=(
            -o Dir::Etc::sourcelist="$APT/sources.list"
            -o Dir::Etc::sourceparts=/dev/null
            -o Dir::State="$APT"
            -o Dir::State::status="$APT/status"
            -o Dir::Cache="$APT"
            -o APT::Architecture=arm64
          )

          apt-get "${APT_OPTS[@]}" update
          apt-get "${APT_OPTS[@]}" -y --no-install-recommends --download-only install \
            libc6-dev libstdc++-11-dev libasound2-dev libpulse-dev libudev-dev \
            libexpat1-dev libnss3-dev libgtk-3-dev python3-dev
          for deb in "$APT"/archives/*.deb; do dpkg-deb -x "$deb" "$SYSROOT"; done

          # Absolute symlinks would resolve against the host instead of the sysroot.
          find "$SYSROOT" -type l -lname '/*' | while read -r l; do
            ln -sfn "$(realpath -m --relative-to="$(dirname "$l")" "$SYSROOT$(readlink "$l")")" "$l"
          done

          grep -q make_unique_for_overwrite "$SYSROOT/usr/include/c++/11/bits/unique_ptr.h"
          echo "SYSROOT_DIR=$SYSROOT" >> $GITHUB_ENV

      - name: Test Remote Connection
        run: |
          git ls-remote --exit-code https://webrtc.googlesource.com/src refs/branch-heads/$WEBRTC_VERSION

      - name: Setup Depot Tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PATH:$(pwd)/depot_tools"
          gclient --version
          test -f depot_tools/python3_bin_reldir.txt
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Check PATH
        run: echo $PATH

      - name: Clone WebRTC source
        run: |
          mkdir webrtc
          cd webrtc
          # Sync the branch in one pass without history; `fetch webrtc` would first clone
          # main and every dependency with full history, then sync the branch on top.
          gclient config --name src --unmanaged https://webrtc.googlesource.com/src.git
          gclient sync --nohooks --no-history --with_branch_heads \
            --revision "src@refs/branch-heads/$WEBRTC_VERSION"
          # The test resources hook downloads audio/video files only tests use
          # (rtc_include_tests=false); without their .sha1 stubs it has nothing to fetch.
          find src/resources -name '*.sha1' -delete
          gclient runhooks

      - name: Patch WebRTC
        run: |
          # Runs every script in patches/; drop a patch by deleting its script.
          shopt -s nullglob
          cd webrtc/src
          for patch in "$GITHUB_WORKSPACE"/patches/*.sh; do
            echo "Applying $(basename "$patch")"
            bash "$patch"
          done

      - name: Configure WebRTC
        env:
          PATH: ${{ env.PATH }}
        run: |
          cd webrtc/src
          mkdir -p out/Release
          # rtc_use_h264 pulls in //third_party/ffmpeg for the H.264 decoder;
          # is_component_ffmpeg builds it as a separate .so, so it stays out of libwebrtc.a.
          gn gen out/Release --args="
              target_os=\"linux\" 
              target_cpu=\"arm64\"
              target_sysroot=\"$SYSROOT_DIR\"
              is_debug=false
              rtc_include_tests=false 
              rtc_use_x11=false 
              rtc_use_h264=true 
              rtc_use_pipewire=false 
              use_rtti=true 
              use_glib=false 
              use_custom_libcxx=false 
              rtc_build_tools=false 
              rtc_build_examples=false 
              is_component_build=false 
              is_component_ffmpeg=true
              clang_use_chrome_plugins=false"

      - name: Check third-party libraries
        env:
          PATH: ${{ env.PATH }}
        run: |
          cd webrtc/src
          python3 "$GITHUB_WORKSPACE/scripts/check_third_party.py" out/Release \
            --notice "$GITHUB_WORKSPACE/NOTICE" \
            --output "$GITHUB_WORKSPACE/third_party_libs.txt"

      - name: Build WebRTC
        env:
          PATH: ${{ env.PATH }}
        run: ninja -C webrtc/src/out/Release

      - name: Organize Output
        run: |
          mkdir -p include
          # Ship headers only for WebRTC and the third_party libraries bundled into libwebrtc.a.
          excludes=(--exclude='/build/' --exclude='/buildtools/' --exclude='/tools/')
          for dir in webrtc/src/third_party/*/; do
            lib="third_party/$(basename "$dir")"
            grep -qx "$lib" third_party_libs.txt || excludes+=(--exclude="/$lib/")
          done
          rsync -amv "${excludes[@]}" --include='*/' \
            --include='*.h' \
            --include='*.hpp' \
            --include='*.inc' \
            --include='*.def' \
            --exclude='*' webrtc/src/ include/

          if [ -d "src/out/Release/gen" ]; then
            echo "Extracting generated headers..."
            rsync -amv --include='*/' \
              --include='*.h' \
              --include='*.inc' \
              --exclude='*' webrtc/src/out/Release/gen/ include/
          fi

          echo "🧹 Cleaning up test files and examples..."
          find include -type f \( \
            -name "*unittest*" \
            -o -name "*_test.h" \
            -o -name "*_test.inc" \
            -o -path "*/test/*" \
            -o -path "*/examples/*" \
            -o -path "*/testing/*" \
          \) -delete
          find include -type d -empty -delete

          mkdir -p lib
          cp webrtc/src/out/Release/obj/libwebrtc.a lib/

      - name: Create release
        run: |
          tar -czvf libwebrtc-arm64.tar.gz include lib LICENSE NOTICE

      - name: Upload build artifact
        if: needs.resolve-version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc-${{ env.WEBRTC_VERSION }}-arm64
          path: libwebrtc-arm64.tar.gz
          retention-days: 1

      - name: Upload Release to GitHub
        if: needs.resolve-version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WEBRTC_VERSION }}
          name: ${{ env.WEBRTC_VERSION }}
          files: libwebrtc-arm64.tar.gz
